name: Atom Learning
description: 'Atom Learning is a UK edtech company providing an online, adaptive exam-preparation
  and learning platform for children aged 7 to 16. Its consumer product, Atom Home, delivers
  personalised practice, unlimited mock tests with instant marking, and progress tracking
  for 11+ grammar and independent-school entrance exams (GL, CEM, CSSE, ISEB), CAT4, Key
  Stage 2 SATs, and GCSE revision. Its schools product, Atom School, gives teachers curriculum-mapped
  resources and assessment tools and is used by over 1,000 schools. Founded by educators
  and assessment specialists, Atom has supported hundreds of thousands of families as a
  lower-cost alternative to private tutoring. The company was surfaced as a SoftBank Vision
  Fund portfolio company and added to the API Evangelist network. It publishes a consumer
  web/app product surface but no public developer API.'
